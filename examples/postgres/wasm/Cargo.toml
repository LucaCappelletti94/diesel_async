[package]
name = "wasm-example"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
diesel = { version = "2.3.0", default-features = false }
diesel-async = { path = "../../../", default-features = false, features = ["postgres"] }
tokio-postgres = { version = "0.7.10", default-features = false, features = ["js"] }
tokio = { version = "1.26", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[patch.crates-io]
diesel = { git = "https://github.com/diesel-rs/diesel", branch = "main" }

[workspace]
